<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3단계 납치 예방 방탈출!</title>
    <style>
        /* 기본 스타일 */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; display: flex;
            justify-content: center; align-items: center; background-color: #1a1a1a;
            font-family: 'Malgun Gothic', sans-serif; overflow: hidden;
        }

        /* 게임 컨테이너 */
        #game-container {
            display: none; position: relative; width: 95%; max-width: 1280px;
            aspect-ratio: 1280 / 853; /* 이미지 비율 */
            border: 2px solid #555;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-size: cover; background-position: center; transition: background-image 0.5s ease-in-out;
        }
        
        /* 타이머 디스플레이 스타일 */
        #timer-display {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); padding: 8px 20px;
            background-color: rgba(0, 0, 0, 0.7); color: white; font-size: 1.8em; font-weight: bold;
            border-radius: 10px; z-index: 15; letter-spacing: 2px;
        }

        /* 클릭 가능한 오브젝트 공통 스타일 */
        .clickable { 
            position: absolute; 
            cursor: pointer; 
        }
        .clickable:hover {
            outline: 3px solid yellow;
            z-index: 10;
        }

        /* --- [수정됨] 1단계 새 오브젝트 위치 --- */
        #s1-ramen { top: 50%; left: 20%; width: 13%; height: 22%; } /* 책상 위 라면 */
        #s1-light { top: 25%; left: 0%; width: 22%; height: 20%; } /* 책상 위 전화기 (기존 light ID 재사용) */
        #s1-sofa { top: 15%; left: 34%; width: 43%; height: 60%; } /* 중앙 소파(암체어) */
        #s1-pillow { top: 75%; left: 53%; width: 38%; height: 22%; } /* 바닥 베개 */
        #exit-stage1 { top: 4%; left: 68%; width: 28%; height: 25%; } /* 창살창문 */

        /* --- 2단계 오브젝트 위치 (미스터리 서재) --- */
        #s2-painting { top: 33%; left: 43%; width: 17%; height: 26%; }
        #s2-bookshelf { top: 50%; left: 18%; width: 12%; height: 12%; }
        #s2-fireplace { top: 10%; left: 50%; width: 25%; height: 25%; }
        #s2-globe { top: 54%; left: 30%; width: 6%; height: 14%; }
        #exit-stage2 { top: 13%; left: 25%; width: 10%; height: 45%; }

        /* --- 3단계 오브젝트 위치 (최종 탈출구) --- */
        #s3-pipes { top: 65%; left: 27%; width: 17%; height: 30%; }
        #s3-lamp { top: 5%; left: 15%; width: 30%; height: 15%; }
        #s3-control-panel { top: 18%; left: 12%; width: 10%; height: 25%; }
        #s3-floor-box { top: 63%; left: 52%; width: 17%; height: 20%; }
        #exit-stage3 { top: 12%; left: 67%; width: 28%; height: 80%; }

        /* --- 모달 공통 스타일 --- */
        .modal {
            display: none; position: fixed; z-index: 20; left: 0; top: 0;
            width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7);
            justify-content: center; align-items: center;
        }
        .modal-content {
            background-color: #fff; padding: 30px; border-radius: 15px; text-align: center;
            width: 90%; max-width: 500px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); position: relative;
        }
        .modal-content .info-input { display: block; width: 80%; margin: 15px auto; padding: 12px; font-size: 1.1em; border: 1px solid #ccc; border-radius: 5px; }
        .modal-content h2 { margin-top: 0; }
        .modal-content p { font-size: 1.1em; line-height: 1.6; }
        .modal-content button {
            padding: 12px 25px; font-size: 1.1em; font-weight: bold; cursor: pointer;
            border: none; background-color: #c0392b; color: white; border-radius: 5px; margin-top: 20px;
        }
        .close-button { position: absolute; top: 15px; right: 25px; font-size: 35px; font-weight: bold; color: #aaa; cursor: pointer; line-height: 1; }

        /* --- 미니게임 스타일 --- */
        #memory-game-board, #fruit-game-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 20px; }
        .card, .fruit { width: 100px; height: 100px; border-radius: 8px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 2.5em; }
        .card { background-color: #34495e; position: relative; transform-style: preserve-3d; transition: transform 0.5s; }
        .card.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; }
        .card-back { transform: rotateY(180deg); }
        .fruit { background-color: #2ecc71; color: white; }
        #missile-game-board { width: 100%; height: 300px; background: #2c3e50; position: relative; overflow: hidden; border-radius: 10px; }
        #missile-player { position: absolute; width: 30px; height: 30px; background: #3498db; border-radius: 50%; bottom: 10px; left: 50%; transform: translateX(-50%); }
        .missile { position: absolute; width: 10px; height: 25px; background: #e74c3c; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="timer-display">00:00</div>
        <!-- 1단계 오브젝트 -->
        <div id="s1-ramen" class="clickable stage-1-obj"></div>
        <div id="s1-light" class="clickable stage-1-obj"></div> <!-- 전화기 역할 -->
        <div id="s1-sofa" class="clickable stage-1-obj"></div>
        <div id="s1-pillow" class="clickable stage-1-obj"></div>
        <div id="exit-stage1" class="clickable stage-1-obj"></div>
        <!-- 2단계 오브젝트 -->
        <div id="s2-painting" class="clickable stage-2-obj"></div>
        <div id="s2-bookshelf" class="clickable stage-2-obj"></div>
        <div id="s2-fireplace" class="clickable stage-2-obj"></div>
        <div id="s2-globe" class="clickable stage-2-obj"></div>
        <div id="exit-stage2" class="clickable stage-2-obj"></div>
        <!-- 3단계 오브젝트 -->
        <div id="s3-pipes" class="clickable stage-3-obj"></div>
        <div id="s3-lamp" class="clickable stage-3-obj"></div>
        <div id="s3-control-panel" class="clickable stage-3-obj"></div>
        <div id="s3-floor-box" class="clickable stage-3-obj"></div>
        <div id="exit-stage3" class="clickable stage-3-obj"></div>
    </div>

    <!-- 각종 모달 -->
    <div id="start-modal" class="modal"><div class="modal-content"><h2>납치 예방 방탈출</h2><p>참가자 정보를 입력하세요.</p><input type="text" id="input-grade" class="info-input" placeholder="학년"><input type="text" id="input-class" class="info-input" placeholder="반"><input type="text" id="input-name" class="info-input" placeholder="이름"><button onclick="startGame()">게임 시작</button></div></div>
    <div id="info-modal" class="modal"><div class="modal-content"><span class="close-button" onclick="closeModal('info-modal')">×</span><h2 id="info-title"></h2><p id="info-text"></p></div></div>
    <div id="quiz-modal" class="modal"><div class="modal-content"><span class="close-button" onclick="closeModal('quiz-modal')">×</span><h2 id="quiz-title"></h2><p id="quiz-question"></p><div id="quiz-options"></div></div></div>
    <div id="password-modal" class="modal"><div class="modal-content"><span class="close-button" onclick="closeModal('password-modal')">×</span><h2 id="password-title"></h2><p>알아낸 비밀번호를 입력하세요.</p><input type="text" id="password-input" maxlength="4" class="info-input"><button onclick="checkPassword()">확인</button></div></div>
    <div id="memory-game-modal" class="modal"><div class="modal-content"><span class="close-button" onclick="closeModal('memory-game-modal')">×</span><h2>안전 표지판 기억하기</h2><p>같은 표지판끼리 짝을 맞추세요.</p><div id="memory-game-board"></div></div></div>
    <div id="fruit-game-modal" class="modal"><div class="modal-content"><span class="close-button" onclick="closeModal('fruit-game-modal')">×</span><h2>신비한 보석 찾기</h2><p>방 안에 숨겨진 진짜 보석 5개를 찾으세요!</p><div id="fruit-game-board"></div></div></div>
    <div id="missile-game-modal" class="modal"><div class="modal-content"><span class="close-button" onclick="closeMissileGame()">×</span><h2>긴급 시스템 피하기</h2><p>천장에서 떨어지는 파편을 15초간 피하세요!</p><div id="missile-game-board"><div id="missile-player"></div></div></div></div>

    <script>
    // === 전역 변수 ===
    let currentStage = 1;
    let startTime, timerInterval;
    const stagePasswords = { 1: "7158", 2: "2398", 3: "3859" };
    const puzzlesCompleted = {};
    
    const puzzleData = {
        's1-ramen':   { position: 0, positionName: '첫 번째' },
        's1-light':   { position: 1, positionName: '두 번째' },
        's1-sofa':    { position: 2, positionName: '세 번째' },
        's1-pillow':  { position: 3, positionName: '네 번째' },
        's2-painting':  { position: 0, positionName: '첫 번째' },
        's2-bookshelf': { position: 1, positionName: '두 번째' },
        's2-fireplace': { position: 2, positionName: '세 번째' },
        's2-globe':     { position: 3, positionName: '네 번째' },
        's3-pipes':         { position: 0, positionName: '첫 번째' },
        's3-lamp':          { position: 1, positionName: '두 번째' },
        's3-control-panel': { position: 2, positionName: '세 번째' },
        's3-floor-box':     { position: 3, positionName: '네 번째' }
    };

    // === 핵심 게임 엔진 ===
    window.onload = () => showModal('start-modal');

    function startGame() {
        const grade = document.getElementById('input-grade').value;
        const classNum = document.getElementById('input-class').value;
        const name = document.getElementById('input-name').value;
        if (!grade || !classNum || !name) { alert('학년, 반, 이름을 모두 입력해주세요!'); return; }
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 1000);
        closeModal('start-modal');
        changeStage(1);
        document.getElementById('game-container').style.display = 'block';
    }

    function updateTimer() {
        const totalSeconds = Math.floor((Date.now() - startTime) / 1000);
        const minutes = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
        const seconds = (totalSeconds % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').innerText = `${minutes}:${seconds}`;
    }

    function changeStage(stage) {
        currentStage = stage;
        // [수정됨] 새 배경 이미지 URL
        const bgImages = {
            1: 'https://i.ibb.co/MkfCDz06/Whisk-391b50b18b.jpg',
            2: 'https://i.ibb.co/14gfjxY/Whisk-8f8a86c7a7.jpg',
            3: 'https://i.ibb.co/CKMWNzxQ/Whisk-ae8d7cbd5f.jpg'
        };
        document.getElementById('game-container').style.backgroundImage = `url('${bgImages[stage]}')`;

        document.querySelectorAll('.clickable').forEach(el => el.style.display = 'none');
        document.querySelectorAll(`.stage-${stage}-obj`).forEach(el => el.style.display = 'block');
    }

    function checkPassword() {
        const input = document.getElementById('password-input').value;
        if (input === stagePasswords[currentStage]) {
            closeModal('password-modal');
            document.getElementById('password-input').value = "";
            if (currentStage < 3) {
                const nextStage = currentStage + 1;
                showInfo(`성공! 다음 장소로 이동합니다.`, `[스테이지 ${nextStage}] 이(가) 시작됩니다.`);
                changeStage(nextStage);
            } else {
                clearInterval(timerInterval);
                const finalTime = document.getElementById('timer-display').innerText;
                alert(`🎉 최종 탈출 성공! 🎉\n총 소요 시간: ${finalTime}\n\n훌륭합니다! 모든 납치 예방 수칙을 배우고 안전하게 탈출했습니다!`);
            }
        } else {
            alert('비밀번호가 틀렸습니다.');
        }
    }

    // === 유틸리티 함수 ===
    function showModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function showInfo(title, text) {
        document.getElementById('info-title').innerText = title;
        document.getElementById('info-text').innerText = text;
        showModal('info-modal');
    }
    
    function handleSolvedPuzzle(id) {
        const info = puzzleData[id];
        const digit = stagePasswords[currentStage][info.position];
        showInfo("이미 해결한 문제입니다.", `이곳에서 얻은 ${info.positionName} 비밀번호는 [ ${digit} ] 입니다.`);
    }

    // === 퀴즈 생성기 ===
    function showQuiz(id, title, question, options, correctAnswer) {
        if (puzzlesCompleted[id]) { handleSolvedPuzzle(id); return; }
        
        document.getElementById('quiz-title').innerText = title;
        document.getElementById('quiz-question').innerText = question;
        const optionsContainer = document.getElementById('quiz-options');
        optionsContainer.innerHTML = '';
        options.forEach(optionText => {
            const button = document.createElement('button');
            button.innerText = optionText;
            button.onclick = () => {
                closeModal('quiz-modal');
                if (optionText === correctAnswer) {
                    puzzlesCompleted[id] = true;
                    const info = puzzleData[id];
                    const digit = stagePasswords[currentStage][info.position];
                    showInfo("정답입니다!", `축하합니다! ${info.positionName} 비밀번호 [ ${digit} ] (을)를 획득했습니다!`);
                } else {
                    showInfo("오답입니다!", "잘못된 선택은 위험을 초래할 수 있습니다. 다시 생각해보세요.");
                }
            };
            optionsContainer.appendChild(button);
        });
        showModal('quiz-modal');
    }

    // === 오브젝트 클릭 이벤트 바인딩 ===
    document.getElementById('s1-ramen').onclick = () => showQuiz('s1-ramen', '문제 1', '낯선 사람이 "엄마 친구인데, 데리러 왔어"라고 말하며 차에 타라고 한다. 어떻게 해야 할까?', ['차에 탄다', '일단 의심하고 부모님께 확인 전화를 한다'], '일단 의심하고 부모님께 확인 전화를 한다');
    document.getElementById('s1-light').onclick = () => showQuiz('s1-light', '문제 2 (전화기)', '위험을 느끼고 소리를 질러야 할 때, 가장 효과적인 말은?', ['"살려주세요!"', '"불이야!"'], '"불이야!"');
    document.getElementById('s1-sofa').onclick = () => showQuiz('s1-sofa', '문제 3', '차 안에 갇혔을 때, 주변 차들에게 위험을 알리는 가장 좋은 방법은?', ['조용히 있는다', '경적(클랙슨)을 계속 울린다'], '경적(클랙슨)을 계속 울린다');
    document.getElementById('s1-pillow').onclick = () => { const id = 's1-pillow'; if (puzzlesCompleted[id]) { handleSolvedPuzzle(id); } else { setupMemoryGame(id); } };
    document.getElementById('exit-stage1').onclick = () => { document.getElementById('password-title').innerText = "1단계 탈출 (창살창문)"; showModal('password-modal'); };

    document.getElementById('s2-painting').onclick = () => showQuiz('s2-painting', '문제 1', '위급 상황 시, 경찰에 신고하는 가장 빠른 전화번호는?', ['112', '114', '119'], '112');
    document.getElementById('s2-bookshelf').onclick = () => showQuiz('s2-bookshelf', '문제 2', '나쁜 사람이 나를 끌고 가려고 할 때, 가장 먼저 해야 할 행동은?', ["가만히 따라간다", "바닥에 주저앉거나 드러누워 버틴다"], "바닥에 주저앉거나 드러누워 버틴다");
    document.getElementById('s2-fireplace').onclick = () => showQuiz('s2-fireplace', '문제 3', '우리 집 주소, 부모님 전화번호 등 개인정보를 낯선 사람에게 알려줘도 될까?', ['절대 안 된다', '친절해 보이면 괜찮다'], '절대 안 된다');
    document.getElementById('s2-globe').onclick = () => { const id = 's2-globe'; if (puzzlesCompleted[id]) { handleSolvedPuzzle(id); } else { setupFruitGame(id); } };
    document.getElementById('exit-stage2').onclick = () => { document.getElementById('password-title').innerText = "2단계 탈출 (캐비닛)"; showModal('password-modal'); };
    
    document.getElementById('s3-pipes').onclick = () => showQuiz('s3-pipes', '문제 1', '매일 같은 길로만 다니는 것이 안전할까?', ['아니오, 가끔 다른 길로 다니는 게 좋다', '네, 익숙한 길이 최고다'], '아니오, 가끔 다른 길로 다니는 게 좋다');
    document.getElementById('s3-lamp').onclick = () => showQuiz('s3-lamp', '문제 2', '친구들과 함께 있을 때는 납치 위험이 전혀 없을까?', ['네, 전혀 없어요', '아니오, 함께 있어도 항상 주변을 경계해야 한다'], '아니오, 함께 있어도 항상 주변을 경계해야 한다');
    document.getElementById('s3-control-panel').onclick = () => showQuiz('s3-control-panel', '문제 3', 'SNS에 내 위치나 개인정보를 자세히 올리는 행동은?', ['안전하다', '매우 위험하다'], '매우 위험하다');
    document.getElementById('s3-floor-box').onclick = () => { const id = 's3-floor-box'; if (puzzlesCompleted[id]) { handleSolvedPuzzle(id); } else { startMissileGame(id); } };
    document.getElementById('exit-stage3').onclick = () => { document.getElementById('password-title').innerText = "최종 탈출 (철문)"; showModal('password-modal'); };

    // === 미니게임 로직 ===
    function setupMemoryGame(id) {
        showModal('memory-game-modal');
        const board = document.getElementById('memory-game-board');
        board.innerHTML = '';
        let emojis = ['⚠️', '🚸', '🚫', '🆘', '⚠️', '🚸', '🚫', '🆘'].sort(() => 0.5 - Math.random());
        let flippedCards = [], matchedPairs = 0;
        emojis.forEach(emoji => {
            const card = document.createElement('div');
            card.classList.add('card');
            card.innerHTML = `<div class="card-face card-front"></div><div class="card-face card-back">${emoji}</div>`;
            card.onclick = () => {
                if (card.classList.contains('flipped') || flippedCards.length === 2) return;
                card.classList.add('flipped');
                flippedCards.push(card);
                if (flippedCards.length === 2) {
                    setTimeout(() => {
                        const [c1, c2] = flippedCards;
                        if (c1.innerText === c2.innerText) {
                            matchedPairs++;
                            if (matchedPairs === emojis.length / 2) {
                                closeModal('memory-game-modal');
                                puzzlesCompleted[id] = true;
                                const info = puzzleData[id]; const digit = stagePasswords[currentStage][info.position];
                                showInfo("성공!", `${info.positionName} 비밀번호 [ ${digit} ] (을)를 획득했습니다!`);
                            }
                        } else { c1.classList.remove('flipped'); c2.classList.remove('flipped'); }
                        flippedCards = [];
                    }, 1000);
                }
            };
            board.appendChild(card);
        });
    }

    function setupFruitGame(id) {
        showModal('fruit-game-modal');
        const board = document.getElementById('fruit-game-board');
        board.innerHTML = '';
        let fruitsToCollect = 5;
        let items = ['💎','💎','💎','💎','💎','💣','💣','💣'].sort(() => 0.5 - Math.random());
        items.forEach(item => {
            const fruit = document.createElement('div');
            fruit.classList.add('fruit');
            fruit.innerText = item;
            fruit.onclick = () => {
                if (fruit.innerText === '💎') {
                    fruit.style.visibility = 'hidden';
                    fruitsToCollect--;
                    if (fruitsToCollect === 0) {
                        closeModal('fruit-game-modal');
                        puzzlesCompleted[id] = true;
                        const info = puzzleData[id]; const digit = stagePasswords[currentStage][info.position];
                        showInfo("성공!", `모든 보석을 찾았습니다! ${info.positionName} 비밀번호는 [ ${digit} ] 입니다.`);
                    }
                } else {
                    closeModal('fruit-game-modal');
                    showInfo("실패!", "가짜 보석(폭탄)을 건드렸습니다! 다시 시도하세요.");
                }
            };
            board.appendChild(fruit);
        });
    }

    let missileInterval, collisionInterval, gameTimeout;
    function startMissileGame(id) {
        showModal('missile-game-modal');
        const board = document.getElementById('missile-game-board');
        const player = document.getElementById('missile-player');
        
        const movePlayer = (e) => {
            e.preventDefault();
            const rect = board.getBoundingClientRect();
            let touchX = e.touches ? e.touches[0].clientX : e.clientX;
            let newLeft = touchX - rect.left - player.offsetWidth / 2;
            if (newLeft < 0) newLeft = 0;
            if (newLeft > board.offsetWidth - player.offsetWidth) newLeft = board.offsetWidth - player.offsetWidth;
            player.style.left = `${newLeft}px`;
        };
        board.onmousemove = movePlayer;
        board.addEventListener('touchmove', movePlayer, { passive: false });
        
        missileInterval = setInterval(() => {
            const missile = document.createElement('div');
            missile.classList.add('missile');
            missile.style.left = `${Math.random() * (board.offsetWidth - 10)}px`;
            missile.style.top = '-25px';
            board.appendChild(missile);
            let fall = setInterval(() => {
                missile.style.top = `${missile.offsetTop + 5}px`;
                if (missile.offsetTop > board.offsetHeight) { clearInterval(fall); missile.remove(); }
            }, 16);
        }, 400);
        collisionInterval = setInterval(() => {
            if (isColliding(player.getBoundingClientRect(), document.querySelectorAll('.missile'))) {
                closeMissileGame();
                showInfo("실패!", "파편에 부딪혔습니다! 다시 시도하세요.");
            }
        }, 50);
        gameTimeout = setTimeout(() => {
            closeMissileGame();
            puzzlesCompleted[id] = true;
            const info = puzzleData[id]; const digit = stagePasswords[currentStage][info.position];
            showInfo("성공!", `모든 파편을 피했습니다! ${info.positionName} 비밀번호는 [ ${digit} ] 입니다!`);
        }, 15000);
    }

    function closeMissileGame() {
        clearInterval(missileInterval); clearInterval(collisionInterval); clearTimeout(gameTimeout);
        closeModal('missile-game-modal');
        document.querySelectorAll('.missile').forEach(m => m.remove());
    }
    
    function isColliding(playerRect, missiles) {
        for (const missile of missiles) {
            const missileRect = missile.getBoundingClientRect();
            if (!(playerRect.right < missileRect.left || playerRect.left > missileRect.right || playerRect.bottom < missileRect.top || playerRect.top > missileRect.bottom)) {
                return true;
            }
        }
        return false;
    }
    </script>
</body>
